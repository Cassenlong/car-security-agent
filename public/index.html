<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汽车数据安全测评 Agent</title><link rel="stylesheet" href="/style.css"></head><body><header><div><h1>汽车数据安全测评 Agent</h1><p class="muted">法规可追溯 · 离线检测 · 确定性风险评分 · 可选模型解释</p></div><a href="https://www.cac.gov.cn/2021-08/20/c_1631049984897667.htm" target="_blank">法规来源说明</a></header><div id="message" class="hidden"></div><main class="grid"><section class="panel"><h2>运行测评</h2><label for="vehicle">车型／测评对象</label><input id="vehicle" placeholder="例如：公开 CAN 数据集 / 某车型接口"><label for="query">测评场景</label><textarea id="query" placeholder="例如：检查车辆位置、VIN 和日志传输安全"></textarea><label for="fileInput">离线测试文件</label><div class="drop"><input id="fileInput" type="file" multiple accept=".json,.csv,.log,.txt"><div id="fileNames" class="muted">支持 JSON、CSV、LOG、TXT；最多 8 个文件、单个 8 MB</div></div><label><input id="model" type="checkbox" style="width:auto"> 使用兼容 OpenAI API 的模型生成解释（可选）</label><div id="modelConfig" class="hidden"><input id="base" placeholder="HTTPS API 基地址，例如 https://api.example.com/v1"><input id="modelName" placeholder="模型名称" style="margin-top:8px"><input id="key" type="password" placeholder="API Key（仅本次请求，不会保存）" style="margin-top:8px"></div><button id="run" style="margin-top:15px">开始 AI 安全测评</button><p class="small muted">隐私：原始上传内容只在本机处理；报告、模型输入和页面证据会脱敏。请勿上传不必要的真实个人数据。</p></section><section class="panel"><h2>导入法规条款</h2><p class="muted">用于扩展 RAG。导入项会标记为“用户导入；未经系统核验”，不会冒充官方文本。</p><textarea id="lawJson" placeholder='[{"document":"法规名称","article":"第X条","text":"条款原文","source":"https://官方来源"}]'></textarea><button id="import" class="secondary" style="margin-top:10px">导入结构化条款</button><hr><p class="small muted">内置知识库含汽车数据规定、个人信息保护法、数据安全法的核心条款摘要；默认使用 BM25 中文检索，配置 Embedding 服务后自动启用混合检索。</p></section></main><section id="results" class="panel hidden"><h2>测评结果</h2><div id="risk"></div><p id="mode" class="muted"></p><h3>AI／离线分析说明</h3><pre id="explain"></pre></section><script src="/app.js"></script></body></html>
